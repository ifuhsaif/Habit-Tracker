<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a19">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Aufstieg – Habit-System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a19; --ink:#ffffff; --muted:#a79fbf; --dim:#6c6487;
  --violet:#7b5cff; --violet2:#5b3df5; --lav:#c9b8ff; --sky:#6fc6ff; --peach:#ffb27a; --mint:#7fe0b0; --danger:#ff6b8a;
  --stroke:rgba(255,255,255,.1); --stroke2:rgba(255,255,255,.2);
  --font:'Manrope','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --r:26px; --r2:16px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
/* Das Design ist bewusst dunkel – die Tokens gelten in beiden Modi. */
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%; touch-action:manipulation; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; min-height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:rgba(13,10,25,.75); -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px); }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; -webkit-tap-highlight-color:transparent; }
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{ outline:2px solid var(--lav); outline-offset:2px; }
input{ font:inherit; color:inherit; }
h1,h2,h3{ margin:0; font-weight:600; letter-spacing:-.02em; }

/* Aurora-Hintergrund, über den das Glas gelegt wird */
.aurora{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
.aurora i{ position:absolute; border-radius:50%; filter:blur(60px); }
.aurora i:nth-child(1){ width:80vw; height:80vw; left:-25vw; top:-30vw; background:#5b3df5; opacity:.55; }
.aurora i:nth-child(2){ width:60vw; height:60vw; right:-28vw; top:22vh; background:#9a5cff; opacity:.3; }
.aurora i:nth-child(3){ width:90vw; height:90vw; left:-10vw; bottom:-45vw; background:#2e1f74; opacity:.7; }
.aurora .star{ position:absolute; width:2px; height:2px; border-radius:50%; background:#fff; opacity:.35; filter:none; }
.app{ position:relative; z-index:1; max-width:520px; margin:0 auto; }

/* Kopfzeile */
.top{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:12px 16px 10px; background:rgba(13,10,25,.55); -webkit-backdrop-filter:blur(18px) saturate(150%); backdrop-filter:blur(18px) saturate(150%); }
.pill{ display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:999px; border:1px solid var(--stroke); background:rgba(255,255,255,.06); font-size:13.5px; font-weight:600; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); box-shadow:inset 0 1px 0 rgba(255,255,255,.1); white-space:nowrap; }
.pill .tag{ font-size:11px; padding:2px 7px; border-radius:999px; background:var(--lav); color:#1a1230; font-weight:700; }
.avatar-sm{ width:40px; height:40px; border-radius:50%; display:grid; place-items:center; font-weight:700; font-size:16px; color:#fff; background:linear-gradient(150deg,#8b6cff,#4a2fd6); border:1px solid rgba(255,255,255,.25); box-shadow:0 8px 20px -8px rgba(123,92,255,.9); flex:0 0 auto; }
.avatar-sm.lg{ width:76px; height:76px; font-size:30px; }
main{ padding:6px 16px 118px; }
.screen[hidden]{ display:none; }

/* Hero */
.hero{ padding:14px 2px 18px; text-align:center; }
.greet{ color:var(--muted); font-size:15px; font-weight:500; }
.head{ font-size:31px; line-height:1.14; font-weight:600; letter-spacing:-.025em; margin-top:6px; }
.sec{ display:flex; justify-content:space-between; align-items:center; margin:18px 2px 10px; font-weight:600; font-size:16px; }
.sec button{ color:var(--muted); font-size:14px; font-weight:600; padding:4px 0 4px 10px; }
.sec .chev{ color:var(--dim); margin-left:4px; }

/* Glas-Kacheln */
.grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.tile,.card{ position:relative; border-radius:var(--r); border:1px solid var(--stroke); background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03)); -webkit-backdrop-filter:blur(22px) saturate(150%); backdrop-filter:blur(22px) saturate(150%); box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 24px 60px -28px rgba(0,0,0,.8); }
.tile{ display:flex; flex-direction:column; min-height:150px; padding:16px 16px 14px; text-align:left; overflow:hidden; transition:transform .14s ease, border-color .14s ease; }
.tile:active{ transform:scale(.975); border-color:var(--stroke2); }
.tile.wide{ grid-column:1/-1; min-height:0; }
.tile.tall{ grid-row:span 2; }
.tile.accent{ background:linear-gradient(160deg,#8b6cff 0%,#6a4bff 45%,#5232ea 100%); border-color:rgba(255,255,255,.22); box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 26px 50px -18px rgba(106,75,255,.75); }
.ttl{ display:flex; justify-content:space-between; align-items:center; font-weight:600; font-size:15.5px; letter-spacing:-.01em; }
.ttl .chev{ color:var(--dim); font-size:20px; line-height:1; font-weight:500; }
.accent .ttl .chev{ color:rgba(255,255,255,.7); }
.subt{ color:var(--muted); font-size:12.5px; margin-top:2px; }
.accent .subt{ color:rgba(255,255,255,.75); }
.num{ margin-top:auto; padding-top:10px; font-size:40px; font-weight:400; letter-spacing:-.04em; line-height:1; display:flex; align-items:baseline; gap:6px; }
.num small{ font-size:13px; font-weight:500; color:var(--muted); letter-spacing:0; }
.accent .num small{ color:rgba(255,255,255,.75); }
.vis{ margin:8px -4px 0; flex:0 0 auto; }
.note{ color:var(--muted); font-size:12.5px; margin-top:6px; }
.accent .note{ color:rgba(255,255,255,.75); }

/* Listen & Checks */
.hrow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); }
.hrow:first-child{ border-top:0; }
.accent .hrow{ border-top-color:rgba(255,255,255,.14); }
.hicon{ width:36px; height:36px; border-radius:12px; display:grid; place-items:center; font-size:17px; background:color-mix(in srgb, var(--c) 16%, transparent); border:1px solid color-mix(in srgb, var(--c) 40%, transparent); flex:0 0 auto; }
.accent .hicon{ background:rgba(255,255,255,.16); border-color:rgba(255,255,255,.22); }
.hname{ flex:1; min-width:0; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hname small{ display:block; font-weight:500; color:var(--muted); font-size:12px; }
.accent .hname small{ color:rgba(255,255,255,.7); }
.chk{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--stroke2); display:grid; place-items:center; color:transparent; font-size:14px; font-weight:700; flex:0 0 auto; transition:transform .12s ease, background .2s ease; }
.chk.done{ background:var(--lav); border-color:var(--lav); color:#1a1230; }
.accent .chk{ border-color:rgba(255,255,255,.55); }
.accent .chk.done{ background:#fff; border-color:#fff; color:var(--violet2); }
.chk:active{ transform:scale(.85); }
.mini .hrow{ padding:8px 0; gap:8px; }
.mini .hicon{ width:auto; height:auto; font-size:18px; background:none; border:0; border-radius:0; }
.mini .hname{ font-size:13.5px; white-space:normal; line-height:1.25; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.mini .hname small{ display:none; }
.mini .chk{ width:26px; height:26px; font-size:12px; }
.skill{ padding:6px 0; font-size:13px; }
.skill .sl{ display:flex; align-items:center; gap:6px; }
.skill .nm{ flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.skill .pc{ font-weight:600; color:var(--muted); font-size:12.5px; }
.skill .pb{ height:5px; margin-top:5px; border-radius:99px; background:rgba(255,255,255,.1); overflow:hidden; }
.skill .pb i{ display:block; height:100%; background:var(--c); border-radius:99px; }

/* Diagramme */
.chart{ width:100%; height:auto; display:block; overflow:visible; }
.chart text{ font-family:var(--font); font-size:11px; fill:var(--muted); font-weight:600; }
.chart text.hi{ fill:#fff; }
.chart .bar{ fill:url(#gBar); }
.chart .bar.empty{ fill:rgba(255,255,255,.08); }
.chart .gl{ stroke:rgba(255,255,255,.08); stroke-width:1; }
.chart .ln{ fill:none; stroke:var(--lav); stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
.chart .ar{ fill:url(#gArea); }
.chart .dt{ fill:#fff; stroke:var(--violet); stroke-width:2; }
.dtrack{ fill:none; stroke:rgba(255,255,255,.1); stroke-width:9; }
.dtrack2{ fill:none; stroke:rgba(255,255,255,.07); stroke-width:3.5; }
.dinner{ fill:none; stroke:rgba(255,255,255,.5); stroke-width:3.5; stroke-linecap:round; }
.dval{ fill:none; stroke:url(#gRing); stroke-width:9; stroke-linecap:round; transition:stroke-dashoffset .6s ease; }
.dwrap{ position:relative; margin:0 auto; }
.dtext{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:500; letter-spacing:-.03em; line-height:1; color:#fff; font-variant-numeric:tabular-nums; pointer-events:none; }
.dtext small{ font-size:.58em; color:var(--muted); margin-left:1px; letter-spacing:0; font-weight:600; }

/* Mini-Matrix (Kalender-Kachel) */
.mm{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
.mm .d{ text-align:center; font-size:12px; color:var(--muted); font-weight:600; line-height:1.2; }
.mm .d.today{ color:var(--lav); }
.mm .dots{ display:flex; flex-direction:column; gap:4px; align-items:center; }
.mm .dot{ width:13px; height:13px; border-radius:5px; border:1px solid var(--stroke2); }
.mm .dot.on{ background:linear-gradient(150deg,#8b6cff,#5b3df5); border-color:transparent; }
.mm .dot.off{ border-style:dashed; opacity:.3; }

/* Kalender-Screen */
.calhead{ display:flex; align-items:center; justify-content:space-between; margin:8px 0 14px; }
.calhead h1{ font-size:26px; }
.calhead .wk{ color:var(--muted); font-size:13px; margin-top:2px; }
.navbtn{ width:42px; height:42px; border-radius:50%; border:1px solid var(--stroke); background:rgba(255,255,255,.06); font-size:22px; line-height:1; display:grid; place-items:center; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
.card{ padding:16px; }
.card + .card{ margin-top:12px; }
.card h2{ font-size:15.5px; margin-bottom:12px; }
.matrix{ display:grid; grid-template-columns:minmax(88px,1.3fr) repeat(7,1fr); gap:8px 3px; align-items:center; }
.mhead{ text-align:center; font-size:11.5px; color:var(--muted); font-weight:600; line-height:1.15; }
.mhead b{ display:block; font-size:15px; color:var(--ink); font-weight:600; }
.mhead.today{ color:var(--lav); }
.mhead.today b{ display:inline-grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--lav); color:#1a1230; }
.mname{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; min-width:0; }
.mname .hicon{ width:26px; height:26px; font-size:12px; border-radius:8px; }
.mname span.t{ overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; line-height:1.2; font-size:12px; overflow-wrap:anywhere; }
.cell{ width:100%; max-width:36px; aspect-ratio:1; margin:0 auto; border-radius:11px; border:1.5px solid var(--stroke2); background:rgba(255,255,255,.03); display:grid; place-items:center; color:transparent; font-size:14px; font-weight:700; transition:transform .1s ease; }
.cell.done{ background:linear-gradient(160deg,#8b6cff,#5b3df5); border-color:transparent; color:#fff; box-shadow:0 8px 18px -8px rgba(123,92,255,.9); }
.cell.off{ border-style:dashed; border-color:var(--stroke); background:transparent; opacity:.35; pointer-events:none; }
.cell.future{ opacity:.3; pointer-events:none; }
.cell.today:not(.done){ border-color:var(--lav); }
.cell:active{ transform:scale(.88); }
.mfoot{ text-align:center; }
.mfoot .b{ height:26px; width:60%; margin:0 auto; border-radius:7px; background:rgba(255,255,255,.07); position:relative; overflow:hidden; }
.mfoot .b i{ position:absolute; left:0; right:0; bottom:0; background:linear-gradient(0deg,#5b3df5,#a08cff); }
.mfoot small{ display:block; font-size:11px; color:var(--muted); margin-top:3px; font-weight:600; }
.sumline{ display:flex; justify-content:space-between; align-items:baseline; margin-top:14px; padding-top:12px; border-top:1px solid rgba(255,255,255,.08); }
.sumline .num{ margin:0; padding:0; font-size:34px; }

/* Statistik */
.kpis{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; }
.kpi{ border-radius:var(--r2); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); padding:12px 14px; }
.kpi b{ display:block; font-size:28px; font-weight:400; letter-spacing:-.03em; line-height:1.05; }
.kpi span{ color:var(--muted); font-size:12px; }
.chips{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:0 -2px; scrollbar-width:none; }
.chips::-webkit-scrollbar{ display:none; }
.chip{ flex:0 0 auto; padding:8px 14px; border-radius:999px; border:1px solid var(--stroke); background:rgba(255,255,255,.05); font-size:13px; font-weight:600; color:var(--muted); white-space:nowrap; }
.chip.on{ color:#1a1230; background:var(--lav); border-color:var(--lav); }
.hbar{ display:flex; align-items:center; gap:10px; padding:8px 0; }
.hbar .hicon{ width:30px; height:30px; font-size:14px; border-radius:9px; }
.hbar .nm{ flex:1 1 42%; min-width:0; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2; }
.hbar .nm small{ display:block; font-weight:500; color:var(--muted); font-size:11.5px; }
.hbar .tr{ flex:1 1 30%; }
.hbar .tr{ flex:1; height:8px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; }
.hbar .tr i{ display:block; height:100%; border-radius:99px; background:var(--c); }
.hbar .pc{ width:44px; text-align:right; font-weight:500; font-size:15px; }
.seg{ display:flex; gap:6px; padding:4px; border-radius:999px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); }
.seg button{ flex:1; padding:8px 0; border-radius:999px; font-weight:600; font-size:13.5px; color:var(--muted); }
.seg button.on{ color:#fff; background:rgba(123,92,255,.35); box-shadow:inset 0 1px 0 rgba(255,255,255,.15); }

/* Analyse */
.asum{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px; }
.asum div{ border-radius:var(--r2); background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); padding:10px 8px; text-align:center; }
.asum b{ display:block; font-size:24px; font-weight:400; letter-spacing:-.03em; line-height:1.05; }
.asum span{ color:var(--muted); font-size:11.5px; }
.ahead{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
.ahead .aring{ flex:0 0 128px; }
.rcap{ text-align:center; color:var(--muted); font-size:12px; font-weight:600; margin-top:2px; }
.astats{ flex:1; display:flex; flex-direction:column; gap:8px; }
.astats div{ display:flex; align-items:baseline; justify-content:space-between; gap:8px; padding:8px 12px; border-radius:14px; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); }
.astats b{ font-size:20px; font-weight:400; letter-spacing:-.03em; line-height:1; font-variant-numeric:tabular-nums; }
.astats span{ color:var(--muted); font-size:11.5px; }
.legend{ color:var(--dim); font-size:11.5px; margin:8px 0 2px; }
.arow{ padding:13px 0 12px; border-top:1px solid rgba(255,255,255,.07); }
.arow:first-of-type{ border-top:0; }
.arow-top{ display:flex; align-items:center; gap:10px; }
.arow-top .hicon{ width:34px; height:34px; font-size:16px; border-radius:11px; }
.arow-nm{ flex:1; min-width:0; font-weight:600; font-size:14.5px; line-height:1.2; }
.arow-nm small{ display:block; color:var(--muted); font-size:11.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.arow-pct{ font-size:28px; font-weight:400; letter-spacing:-.04em; line-height:1; font-variant-numeric:tabular-nums; }
.arow-pct small{ font-size:13px; color:var(--muted); margin-left:1px; letter-spacing:0; }
.arow-pct.ok{ color:#c6f5df; } .arow-pct.bad{ color:#ffd0b0; }
.arow-bar{ position:relative; height:10px; border-radius:99px; background:rgba(255,255,255,.08); margin:11px 0 9px; }
.arow-bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:linear-gradient(90deg, color-mix(in srgb, var(--c) 45%, #5b3df5), var(--c)); box-shadow:0 0 14px -3px var(--c); transition:width .5s ease; }
.arow-bar b{ position:absolute; top:-4px; bottom:-4px; width:2px; border-radius:2px; background:#fff; opacity:.75; transform:translateX(-1px); }
.arow-chips{ display:flex; align-items:center; gap:6px; }
.arow-chips span{ font-size:11.5px; color:var(--muted); padding:4px 9px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.07); white-space:nowrap; }
.arow-chips span b{ color:#fff; font-weight:600; margin-left:3px; font-variant-numeric:tabular-nums; }
.arow-chips em{ margin-left:auto; font-style:normal; font-size:11.5px; font-weight:600; color:var(--muted); white-space:nowrap; }
.arow-chips em.ok{ color:var(--mint); } .arow-chips em.bad{ color:var(--peach); }
.aprev{ display:flex; gap:12px; align-items:center; margin-top:10px; }
.aprev-ring{ flex:0 0 88px; }
.aprev-list{ flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
.pr{ display:flex; align-items:center; gap:7px; font-size:12.5px; }
.pr .ic{ font-size:14px; width:18px; text-align:center; flex:0 0 auto; }
.pr .nm{ width:70px; flex:0 0 auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; }
.pr .bar{ flex:1; position:relative; height:6px; border-radius:99px; background:rgba(255,255,255,.09); }
.pr .bar i{ position:absolute; left:0; top:0; bottom:0; border-radius:99px; background:var(--c); }
.pr .bar b{ position:absolute; top:-2px; bottom:-2px; width:2px; background:#fff; opacity:.6; transform:translateX(-1px); }
.pr .pc{ width:38px; text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
.pr .pc.ok{ color:var(--mint); } .pr .pc.bad{ color:var(--peach); }
.rank .bar{ width:56px; height:5px; border-radius:99px; background:rgba(255,255,255,.09); overflow:hidden; flex:0 0 auto; }
.rank .bar i{ display:block; height:100%; background:var(--c); border-radius:99px; }
.rank{ display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); }
.rank:first-child{ border-top:0; }
.rank b{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; background:rgba(123,92,255,.3); border:1px solid rgba(201,184,255,.35); font-size:13px; font-weight:600; flex:0 0 auto; }
.rank .nm{ flex:1; min-width:0; font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rank .pc{ font-weight:500; color:var(--muted); font-variant-numeric:tabular-nums; }
.grow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid rgba(255,255,255,.07); }
.grow:first-child{ border-top:0; }
.grow .hname{ flex:1; }
.stepper{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }
.stepper button{ width:34px; height:34px; border-radius:50%; border:1px solid var(--stroke2); background:rgba(255,255,255,.06); font-size:18px; line-height:1; display:grid; place-items:center; }
.stepper output{ width:54px; text-align:center; font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; }
.hdrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
.hdrow h2{ margin:0; }

/* Schlaf-Slider */
.sleeprow{ display:flex; align-items:center; gap:14px; margin-top:10px; }
.sleeprow .num{ margin:0; padding:0; flex:0 0 auto; min-width:86px; }
.range{ -webkit-appearance:none; appearance:none; width:100%; height:12px; border-radius:99px; margin:0; background:linear-gradient(90deg,#7b5cff 0%,#c9b8ff var(--p,50%),rgba(255,255,255,.1) var(--p,50%)); outline:none; }
.range::-webkit-slider-thumb{ -webkit-appearance:none; appearance:none; width:26px; height:26px; border-radius:50%; background:#fff; border:0; box-shadow:0 4px 14px -2px rgba(0,0,0,.7), 0 0 0 4px rgba(201,184,255,.25); }
.range::-moz-range-thumb{ width:26px; height:26px; border-radius:50%; background:#fff; border:0; box-shadow:0 4px 14px -2px rgba(0,0,0,.7); }
.range:focus-visible{ outline:2px solid var(--lav); outline-offset:4px; }
.srow{ display:grid; grid-template-columns:64px 52px 1fr; align-items:center; gap:10px; padding:10px 0; border-top:1px solid rgba(255,255,255,.07); }
.srow:first-child{ border-top:0; }
.srow .dn{ font-weight:600; font-size:13.5px; }
.srow .dn small{ display:block; color:var(--muted); font-weight:500; font-size:11px; }
.srow .sv{ font-weight:600; font-variant-numeric:tabular-nums; font-size:14px; }
.srow .range{ height:10px; }
.srow .range::-webkit-slider-thumb{ width:22px; height:22px; }
.scell{ text-align:center; font-size:12px; font-weight:600; color:var(--muted); font-variant-numeric:tabular-nums; }
.scell.ok{ color:var(--mint); }
.chart .goal{ stroke:var(--lav); stroke-width:1.2; stroke-dasharray:3 4; opacity:.8; }
/* Reihenfolge der Habits */
.orow{ display:flex; align-items:center; gap:8px; border-top:1px solid rgba(255,255,255,.07); }
.orow:first-child{ border-top:0; }
.orow .editrow{ flex:1; min-width:0; border-top:0; }
.ord{ display:flex; flex-direction:column; gap:4px; flex:0 0 auto; }
.ord button{ width:32px; height:26px; border-radius:8px; border:1px solid var(--stroke); background:rgba(255,255,255,.05); font-size:13px; display:grid; place-items:center; }
.ord button:disabled{ opacity:.22; }

/* Tab-Leiste (schwebendes Glas) */
.tabwrap{ position:fixed; left:0; right:0; bottom:max(12px, env(safe-area-inset-bottom,0px)); z-index:20; display:flex; justify-content:center; padding:0 16px; pointer-events:none; }
.tabbar{ pointer-events:auto; width:100%; max-width:488px; display:flex; padding:6px; border-radius:999px; border:1px solid var(--stroke2); background:rgba(22,16,42,.62); -webkit-backdrop-filter:blur(26px) saturate(160%); backdrop-filter:blur(26px) saturate(160%); box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 20px 40px -14px rgba(0,0,0,.8); }
.tabbar button{ flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 0 7px; min-width:0; font-size:11px; border-radius:999px; color:var(--dim); font-weight:600; font-size:11.5px; transition:background .2s ease,color .2s ease; }
.tabbar button svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
.tabbar button.on{ color:#fff; background:rgba(123,92,255,.32); box-shadow:inset 0 1px 0 rgba(255,255,255,.18); }

/* Overlays: Detail-Panel und Editor-Sheet */
.overlay{ position:fixed; inset:0; z-index:40; background:rgba(8,5,18,.55); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); }
.overlay[hidden]{ display:none; }
.panel{ position:absolute; inset:0; max-width:520px; margin:0 auto; background:linear-gradient(180deg,#1a1233 0%,#0d0a19 45%); display:flex; flex-direction:column; animation:slidein .22s ease; }
.phead{ position:sticky; top:0; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px; z-index:2; }
.back{ width:42px; height:42px; border-radius:50%; border:1px solid var(--stroke); background:rgba(255,255,255,.06); font-size:20px; display:grid; place-items:center; -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); }
.ptitle{ font-size:30px; font-weight:600; letter-spacing:-.03em; line-height:1.1; margin:2px 2px 14px; }
.pbody{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:4px 16px calc(30px + env(safe-area-inset-bottom,0px)); }
.sheet .panel{ top:auto; bottom:0; max-height:92%; border-radius:30px 30px 0 0; border:1px solid var(--stroke2); border-bottom:0; animation:slideup .24s ease; background:linear-gradient(180deg,#1d1538,#0f0b1f); }
.sheet .phead{ padding-top:10px; }
.sheet .phead::before{ content:""; position:absolute; left:50%; top:8px; width:40px; height:4px; border-radius:99px; background:rgba(255,255,255,.2); transform:translateX(-50%); }
.sheet .phead{ padding-top:22px; }
@keyframes slidein{ from{ transform:translateX(28px); opacity:0; } to{ transform:none; opacity:1; } }
@keyframes slideup{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }
@media (prefers-reduced-motion: reduce){ .panel{ animation:none; } .tile,.chk,.cell,.tabbar button{ transition:none; } .dval{ transition:none; } }

/* Formular */
.field{ margin-bottom:18px; }
.field label{ display:block; font-size:12.5px; font-weight:600; color:var(--muted); margin-bottom:8px; }
.inp{ width:100%; padding:14px 16px; border-radius:18px; border:1px solid var(--stroke2); background:rgba(255,255,255,.06); font-size:16px; font-weight:600; box-shadow:inset 0 1px 0 rgba(255,255,255,.08); }
.inp::placeholder{ color:var(--dim); font-weight:500; }
textarea.inp{ resize:vertical; min-height:120px; display:block; margin:8px 0 10px; }
.icons{ display:grid; grid-template-columns:repeat(8,1fr); gap:6px; }
.icons button{ aspect-ratio:1; border-radius:12px; border:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.05); font-size:18px; display:grid; place-items:center; }
.icons button.on{ border-color:var(--lav); background:rgba(201,184,255,.22); }
.swatches{ display:flex; flex-wrap:wrap; gap:10px; }
.swatches button{ width:36px; height:36px; border-radius:50%; background:var(--c); border:3px solid transparent; opacity:.65; }
.swatches button.on{ opacity:1; border-color:#fff; box-shadow:0 0 0 2px rgba(255,255,255,.2); }
.days{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
.days button{ aspect-ratio:1; border-radius:50%; border:1px solid var(--stroke); font-weight:600; font-size:13px; color:var(--muted); background:rgba(255,255,255,.04); }
.days button.on{ color:#1a1230; border-color:transparent; background:var(--lav); }
.quick{ display:flex; gap:8px; margin-top:10px; }
.quick button{ font-size:12.5px; color:var(--muted); padding:5px 12px; border-radius:999px; border:1px solid rgba(255,255,255,.1); font-weight:600; }
.btn{ width:100%; padding:15px; border-radius:999px; font-weight:700; font-size:16px; text-align:center; }
.btn.primary{ background:linear-gradient(160deg,#8b6cff,#5b3df5); color:#fff; box-shadow:0 14px 30px -12px rgba(123,92,255,.9), inset 0 1px 0 rgba(255,255,255,.25); }
.btn.ghost{ border:1px solid var(--stroke2); color:#fff; background:rgba(255,255,255,.05); margin-top:10px; }
.btn.danger{ border:1px solid rgba(255,107,138,.45); color:var(--danger); margin-top:10px; }
.btn.danger.arm{ background:rgba(255,107,138,.15); }
.btn:disabled{ opacity:.45; box-shadow:none; }
.btn.sm{ padding:11px 18px; font-size:14.5px; width:auto; }
.empty{ text-align:center; color:var(--muted); font-size:13.5px; padding:14px 6px; }
.empty .btn{ margin-top:12px; }
.linkrow{ margin-top:14px; text-align:center; }
.linkrow button{ color:var(--lav); font-weight:600; font-size:14px; padding:8px 12px; }
.meta{ color:var(--muted); font-size:12.5px; margin-top:10px; line-height:1.5; }
.editrow{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid rgba(255,255,255,.07); width:100%; text-align:left; }
.editrow:first-child{ border-top:0; }
.editrow .hname{ font-size:15px; }
.editrow .ar{ color:var(--dim); font-size:20px; }
.toast{ position:fixed; left:50%; bottom:calc(96px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:60; padding:11px 18px; border-radius:999px; background:rgba(34,24,66,.85); border:1px solid var(--stroke2); font-weight:600; font-size:14px; -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px); box-shadow:0 14px 30px -10px rgba(0,0,0,.8); }
.toast[hidden]{ display:none; }
.dayrow{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid rgba(255,255,255,.07); font-size:14px; }
.dayrow:first-child{ border-top:0; }
.dayrow .dn{ width:56px; font-weight:600; font-size:14px; }
.dayrow .tr{ flex:1; height:7px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; }
.dayrow .tr i{ display:block; height:100%; background:linear-gradient(90deg,#5b3df5,#a08cff); border-radius:99px; }
.dayrow .pc{ width:64px; text-align:right; color:var(--muted); font-size:13px; }
.dayrow.today .dn{ color:var(--lav); }
.donuts{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.donuts figure{ margin:0; text-align:center; }
.donuts figcaption{ color:var(--muted); font-size:12px; margin-top:4px; }
.prof{ display:flex; align-items:center; gap:16px; }
.prof .pname{ font-size:22px; font-weight:600; letter-spacing:-.02em; }
.prof .prank{ color:var(--muted); font-size:13.5px; margin:2px 0 8px; }
.xpbar{ height:7px; border-radius:999px; background:rgba(255,255,255,.1); overflow:hidden; }
.xpbar i{ display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,#5b3df5,#c9b8ff); transition:width .5s ease; }
.xptxt{ color:var(--muted); font-size:12px; margin-top:5px; }
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gBar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a08cff"/><stop offset="1" stop-color="#5b3df5"/></linearGradient>
    <linearGradient id="gArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9f86ff" stop-opacity=".55"/><stop offset="1" stop-color="#5b3df5" stop-opacity="0"/></linearGradient>
    <linearGradient id="gRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9b8ff"/><stop offset="1" stop-color="#7b5cff"/></linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="top">
    <button class="avatar-sm" id="top-avatar" data-open="profile" aria-label="Profil öffnen">✦</button>
    <button class="pill" id="top-date" data-open="today">Heute</button>

  <main>

  </main>

  <div class="tabwrap">
    <nav class="tabbar" aria-label="Hauptnavigation">
      <button data-nav="home" class="on" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10"/></svg>Start</button>
      <button data-nav="cal" aria-label="Kalender"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h2M12 14h2M16 14h2"/></svg>Kalender</button>
      <button data-nav="stats" aria-label="Statistik"><svg viewBox="0 0 24 24"><path d="M4 19V11M10 19V5M16 19v-7M22 19H2"/></svg>Statistik</button>
      <button data-nav="ana" aria-label="Analyse"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h9M4 18h6"/><path d="M15 16l2.5 2.5L22 14"/></svg>Analyse</button>
      <button data-nav="habits" aria-label="Habits"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Habits</button>

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s);
const DAYS=['Mo','Di','Mi','Do','Fr','Sa','So'];
const DAYS_LONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const COLORS=['#8b6cff','#c9b8ff','#5b8cff','#6fc6ff','#4fd1c5','#7fe0b0','#b8f26b','#ffd166','#ffb27a','#ff8a65','#ff7eb6','#ff6b8a'];
const ICONS=['📚','🏋️','💧','🧘','🏃','🚴','💶','🎯','🧠','💻','✍️','🥗','😴','🎵','🧹','🚿','🌅','📵','🎬','🗣️','🙏','🍎','🪥','📓'];
const KEY='aufstieg.v1';

/* ---------- Datum ---------- */
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const wd=d=>(d.getDay()+6)%7+1;            /* 1 = Montag … 7 = Sonntag */
const startOfWeek=d=>addDays(d,1-wd(d));
const todayKey=()=>key(new Date());
const weekDays=off=>{const s=addDays(startOfWeek(new Date()),off*7);return Array.from({length:7},(_,i)=>addDays(s,i));};
const fmtShort=d=>d.getDate()+'.'+(d.getMonth()+1)+'.';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct=v=>v==null?'–':Math.round(v*100)+' %';
function isoWeek(d){ const x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())); const day=x.getUTCDay()||7; x.setUTCDate(x.getUTCDate()+4-day); const y0=new Date(Date.UTC(x.getUTCFullYear(),0,1)); return Math.ceil(((x-y0)/864e5+1)/7); }

/* ---------- Zustand ---------- */
function normalize(o){
  o=(o&&typeof o==='object')?o:{};
  return {
    name:typeof o.name==='string'?o.name.slice(0,24):'',
    habits:Array.isArray(o.habits)?o.habits.filter(h=>h&&h.id&&h.name).map(h=>({
      id:String(h.id), name:String(h.name).slice(0,40), icon:h.icon||'🎯',
      color:Math.min(COLORS.length-1,Math.max(0,h.color|0)),
      days:(Array.isArray(h.days)&&h.days.length)?h.days.map(Number).filter(n=>n>=1&&n<=7):[1,2,3,4,5,6,7],
      createdAt:/^\d{4}-\d{2}-\d{2}$/.test(h.createdAt||'')?h.createdAt:todayKey()
    })):[],
    checks:(o.checks&&typeof o.checks==='object'&&!Array.isArray(o.checks))?o.checks:{},
    goals:(o.goals&&typeof o.goals==='object'&&!Array.isArray(o.goals))?o.goals:{},
    sleep:(o.sleep&&typeof o.sleep==='object'&&!Array.isArray(o.sleep))?Object.fromEntries(Object.entries(o.sleep).filter(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&isFinite(+v)&&+v>0).map(([k,v])=>[k,Math.min(14,+v)])):{},
    sleepGoal:(isFinite(+o.sleepGoal)&&+o.sleepGoal>=4&&+o.sleepGoal<=12)?+o.sleepGoal:8,
    updatedAt:+o.updatedAt||0
  };
}
let S=normalize(null);
try{ const raw=localStorage.getItem(KEY); if(raw) S=normalize(JSON.parse(raw)); }catch(e){}

const ui={screen:'home',calOffset:0,statFilter:'all',statWeeks:12,anaOffset:0,detail:null,sheet:null,draft:null,gdraft:null,armed:null};

function commit(){
  S.updatedAt=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){}
  queueCloud();
  renderAll();
}

/* ---------- Cloud-Sync (Claude-Konto) ---------- */
const cloud={ref:null,status:'local',timer:null,chain:Promise.resolve(),unsub:null};
function queueCloud(){
  if(!cloud.ref) return;
  clearTimeout(cloud.timer);
  cloud.timer=setTimeout(()=>{
    const body=JSON.parse(JSON.stringify(S));
    cloud.chain=cloud.chain.then(()=>cloud.ref.set(body)).then(()=>{cloud.status='cloud';}).catch(()=>{cloud.status='error';});
  },700);
}
async function initCloud(){
  try{
    if(!window.claude||typeof window.claude.use!=='function') return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    cloud.ref=db.doc('data/users/'+uid+'/state');
    const snap=await cloud.ref.get();
    if(snap.exists){
      const remote=normalize(snap.data());
      if(remote.updatedAt>S.updatedAt){ S=remote; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} renderAll(); }
      else if(S.updatedAt>remote.updatedAt) queueCloud();
    }else if(S.habits.length||Object.keys(S.checks).length){ queueCloud(); }
    cloud.status='cloud';
    cloud.unsub=cloud.ref.onSnapshot(s=>{
      if(!s.exists||s.metadata.hasPendingWrites) return;
      const remote=normalize(s.data());
      if(remote.updatedAt>S.updatedAt){ S=remote; try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){} renderAll(); }
    },()=>{});
    if(ui.detail==='profile') renderDetail();
  }catch(e){ cloud.status='error'; }
}

/* ---------- Berechnungen ---------- */
const habitById=id=>S.habits.find(h=>h.id===id);
const isDue=(h,k)=>k>=h.createdAt&&h.days.includes(wd(parse(k)));
const isDone=(h,k)=>!!(S.checks[k]&&S.checks[k][h.id]);
function toggle(h,k){
  const c=S.checks[k]||(S.checks[k]={});
  if(c[h.id]){ delete c[h.id]; if(!Object.keys(c).length) delete S.checks[k]; }
  else c[h.id]=1;
  commit();
}
function dayStat(k,hs=S.habits){ let due=0,done=0; for(const h of hs){ if(isDue(h,k)){ due++; if(isDone(h,k)) done++; } } return {due,done,pct:due?done/due:null}; }
function rangeStat(from,to,hs=S.habits){
  let due=0,done=0; const T=todayKey(), tk=key(to);
  for(let d=new Date(from);;d=addDays(d,1)){ const k=key(d); if(k>tk||k>T) break; const s=dayStat(k,hs); due+=s.due; done+=s.done; }
  return {due,done,pct:due?done/due:null};
}
function streak(h){
  let d=new Date(); const T=key(d);
  if(isDue(h,T)&&!isDone(h,T)) d=addDays(d,-1);
  let n=0;
  for(let i=0;i<800;i++){ const k=key(d); if(k<h.createdAt) break; if(isDue(h,k)){ if(isDone(h,k)) n++; else break; } d=addDays(d,-1); }
  return n;
}
function bestStreak(h){
  let best=0,cur=0; const T=todayKey();
  for(let d=parse(h.createdAt);key(d)<=T;d=addDays(d,1)){ const k=key(d); if(!isDue(h,k)) continue; if(isDone(h,k)){ cur++; best=Math.max(best,cur); } else if(k!==T) cur=0; }
  return best;
}
function hasAnyCheck(k){ const c=S.checks[k]; return !!c&&Object.keys(c).some(id=>habitById(id)); }
function activeStreak(){
  let d=new Date(); if(!hasAnyCheck(key(d))) d=addDays(d,-1);
  let n=0; for(let i=0;i<800;i++){ if(hasAnyCheck(key(d))) n++; else break; d=addDays(d,-1); } return n;
}
function totals(){
  let done=0,perfect=0,days=0; const T=todayKey();
  for(const k in S.checks){ if(k>T) continue; const n=Object.keys(S.checks[k]).filter(id=>habitById(id)).length; if(!n) continue; done+=n; days++; const s=dayStat(k); if(s.due&&s.done===s.due) perfect++; }
  return {done,perfect,days};
}
function weekSeries(n,hs){ const out=[]; for(let i=n-1;i>=0;i--){ const days=weekDays(-i); out.push({start:days[0],...rangeStat(days[0],days[6],hs)}); } return out; }
function last30(hs){ return rangeStat(addDays(new Date(),-29),new Date(),hs); }
function habitsFor(filter){ return filter==='all'?S.habits:S.habits.filter(h=>h.id===filter); }
const scheduleLabel=h=>h.days.length===7?'täglich':h.days.length===5&&!h.days.includes(6)&&!h.days.includes(7)?'werktags':h.days.map(n=>DAYS[n-1]).join(' ');

/* ---------- Schlaf ---------- */
const SLEEP_MAX=12;
const fmtH=v=>v==null?'–':(Math.round(v*2)/2).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:1});
const sleepAt=k=>S.sleep[k]!=null?+S.sleep[k]:null;
function sleepAvg(nDays){ let sum=0,n=0; for(let i=0;i<nDays;i++){ const v=sleepAt(key(addDays(new Date(),-i))); if(v!=null){ sum+=v; n++; } } return n?sum/n:null; }
function sleepSeries(nDays){ const out=[]; for(let i=nDays-1;i>=0;i--){ const d=addDays(new Date(),-i); out.push({d,v:sleepAt(key(d))}); } return out; }
function sleepSlider(k,cls=''){ const v=sleepAt(k)||0; return `<input type="range" class="range ${cls}" min="0" max="${SLEEP_MAX}" step="0.5" value="${v}" data-sleep="${k}" style="--p:${(v/SLEEP_MAX*100).toFixed(1)}%" aria-label="Schlafstunden">`; }
function moveHabit(id,dir){ const i=S.habits.findIndex(h=>h.id===id), j=i+dir; if(i<0||j<0||j>=S.habits.length) return; [S.habits[i],S.habits[j]]=[S.habits[j],S.habits[i]]; commit(); }

/* ---------- Monatsanalyse ---------- */
function ymOffset(off){ const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()+off); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function monthDays(ym){ const [y,m]=ym.split('-').map(Number); const n=new Date(y,m,0).getDate(); return Array.from({length:n},(_,i)=>`${y}-${pad(m)}-${pad(i+1)}`); }
function monthLabel(ym){ const [y,m]=ym.split('-').map(Number); return MONTHS[m-1]+' '+y; }
/* Ziel in %: gilt ab dem Monat, in dem es gesetzt wurde, für alle folgenden Monate – bis es geändert wird. Standard 100 %. */
function goalFor(h,ym){
  const g=S.goals; if(g[ym]&&g[ym][h.id]!=null) return g[ym][h.id];
  let [y,m]=ym.split('-').map(Number);
  for(let i=0;i<36;i++){ m--; if(m<1){ m=12; y--; } const k=y+'-'+pad(m); if(g[k]&&g[k][h.id]!=null) return g[k][h.id]; }
  return 100;
}
function monthAnalysis(ym){
  const days=monthDays(ym), T=todayKey(), cur=T.slice(0,7);
  const past=ym<cur, future=ym>cur;
  const rows=S.habits.map(h=>{
    let possible=0,sofar=0,actual=0;
    for(const k of days){ if(!isDue(h,k)) continue; possible++; if(k<=T){ sofar++; if(isDone(h,k)) actual++; } }
    const goalPct=goalFor(h,ym), goal=Math.round(possible*goalPct/100);
    const left=Math.max(0,goal-actual), pct=goal?actual/goal:(possible?null:null);
    const expected=possible?goal*sofar/possible:0, behind=Math.ceil(expected-actual-1e-9);
    let status='',cls='';
    if(!possible) status='nicht geplant';
    else if(future) status='kommt noch';
    else if(past){ status=actual>=goal?'Ziel erreicht':'Ziel verfehlt'; cls=actual>=goal?'ok':'bad'; }
    else if(actual>=goal){ status='Ziel erreicht'; cls='ok'; }
    else if(behind<=0){ status='auf Kurs'; cls='ok'; }
    else { status=behind+' hinter Plan'; cls='bad'; }
    return {h,possible,sofar,actual,goalPct,goal,left,pct,status,cls,pace:possible?sofar/possible:0};
  });
  const withGoal=rows.filter(r=>r.goal>0);
  const totGoal=withGoal.reduce((a,r)=>a+r.goal,0), totActual=withGoal.reduce((a,r)=>a+Math.min(r.actual,r.goal),0);
  const onTrack=withGoal.filter(r=>r.cls==='ok').length;
  const daysLeft=future?days.length:past?0:days.filter(k=>k>T).length;
  const elapsed=future?0:past?1:(days.length-daysLeft)/days.length;
  return {ym,rows,withGoal,totGoal,totActual,pct:totGoal?totActual/totGoal:null,onTrack,daysLeft,past,future,elapsed,current:!past&&!future};
}

/* ---------- Diagramme (SVG) ---------- */
function barChart(vals,labels,opt={}){
  const W=opt.w||300,H=opt.h||120,pb=opt.labels===false?6:22,pt=8,n=vals.length;
  const gap=W/n,bw=Math.min(opt.bw||24,gap*.56),inner=H-pb-pt;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'Balkendiagramm')}">`;
  for(let g=1;g<=2;g++){ const y=(pt+inner*(1-g/2)).toFixed(1); s+=`<line class="gl" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  if(opt.goal!=null){ const y=(pt+inner*(1-Math.min(1,opt.goal))).toFixed(1); s+=`<line class="goal" x1="0" x2="${W}" y1="${y}" y2="${y}"/>`; }
  vals.forEach((v,i)=>{
    const x=(i*gap+(gap-bw)/2).toFixed(1);
    if(v==null){ s+=`<rect class="bar empty" x="${x}" y="${(pt+inner-4).toFixed(1)}" width="${bw.toFixed(1)}" height="4" rx="2"/>`; }
    else{ const h=Math.max(4,inner*v); s+=`<rect class="bar" x="${x}" y="${(pt+inner-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(7,bw/2).toFixed(1)}"/>`; }
    if(opt.labels!==false) s+=`<text x="${(i*gap+gap/2).toFixed(1)}" y="${H-6}" text-anchor="middle" class="${opt.hi===i?'hi':''}">${esc(labels[i])}</text>`;
  });
  return s+'</svg>';
}
function donut(p,opt={}){
  const r=40,c=2*Math.PI*r,off=c*(1-(p||0)),size=opt.size||120;
  return `<div class="dwrap" style="max-width:${size}px">
    <svg class="chart" viewBox="0 0 100 100" role="img" aria-label="${esc(opt.aria||'Fortschritt')}">
    <circle class="dtrack" cx="50" cy="50" r="${r}"/>
    <circle class="dval" cx="50" cy="50" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 50 50)"/>
    ${opt.inner!=null?`<circle class="dtrack2" cx="50" cy="50" r="31"/><circle class="dinner" cx="50" cy="50" r="31" stroke-dasharray="${(2*Math.PI*31).toFixed(1)}" stroke-dashoffset="${(2*Math.PI*31*(1-opt.inner)).toFixed(1)}" transform="rotate(-90 50 50)"/>`:''}
    </svg>
    <div class="dtext" style="font-size:${Math.round(size*.22)}px">${p==null?'–':Math.round(p*100)+'<small>%</small>'}</div>
  </div>`;
}
function lineChart(series,opt={}){
  const W=opt.w||320,H=opt.h||150,pl=opt.mini?4:30,pr=opt.mini?4:12,pt=opt.mini?6:12,pb=opt.mini?2:24,n=series.length;
  const xs=i=>pl+(W-pl-pr)*(n>1?i/(n-1):.5), ys=p=>pt+(H-pt-pb)*(1-p);
  const pts=series.map((s,i)=>s.pct==null?null:[xs(i),ys(s.pct)]);
  const segs=[]; let seg=[]; pts.forEach(p=>{ if(p) seg.push(p); else{ if(seg.length) segs.push(seg); seg=[]; } }); if(seg.length) segs.push(seg);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opt.aria||'Verlauf')}">`;
  if(!opt.mini){ [0,.5,1].forEach(g=>{ const y=ys(g).toFixed(1); s+=`<line class="gl" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text x="${pl-6}" y="${(+y+4).toFixed(1)}" text-anchor="end">${Math.round(g*100)}</text>`; }); }
  /* weiche Kurve über die Punkte */
  for(const sg of segs){
    let d='M'+sg[0][0].toFixed(1)+' '+sg[0][1].toFixed(1);
    for(let i=1;i<sg.length;i++){ const a=sg[i-1],b=sg[i],cx=((a[0]+b[0])/2).toFixed(1); d+=` C${cx} ${a[1].toFixed(1)} ${cx} ${b[1].toFixed(1)} ${b[0].toFixed(1)} ${b[1].toFixed(1)}`; }
    if(sg.length>1) s+=`<path class="ar" d="${d} L${sg[sg.length-1][0].toFixed(1)} ${ys(0).toFixed(1)} L${sg[0][0].toFixed(1)} ${ys(0).toFixed(1)} Z"/>`;
    s+=`<path class="ln" d="${d}"/>`;
  }
  if(!opt.mini||opt.dots) pts.forEach((p,i)=>{ if(p&&(!opt.mini||i===n-1)) s+=`<circle class="dt" cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${opt.mini?3:4}"/>`; });
  if(!opt.mini){ const step=Math.ceil(n/6); series.forEach((w,i)=>{ if((n-1-i)%step===0) s+=`<text x="${xs(i).toFixed(1)}" y="${H-6}" text-anchor="middle" class="${i===n-1?'hi':''}">${fmtShort(w.start)}</text>`; }); }
  return s+'</svg>';
}

const STANDALONE=!(window.claude&&typeof window.claude.use==='function');
function backupJSON(){ return JSON.stringify({app:'aufstieg',version:1,exportedAt:new Date().toISOString(),data:S},null,1); }
function openBackup(mode){ ui.sheet='backup'; ui.draft=null; ui.gdraft=null; ui.bmode=mode; renderBackup(); $('#sheet').hidden=false; }

function applyImport(text){
  let o; try{ o=JSON.parse(text); }catch(e){ toast('Kein gültiges Backup'); return; }
  const d=o&&o.app==='aufstieg'&&o.data?o.data:o;
  const n=normalize(d);
  if(!n.habits.length&&!Object.keys(n.checks).length&&!Object.keys(n.sleep).length){ toast('Backup enthält keine Daten'); return; }
  S=n; closeSheet(); commit(); toast('Daten importiert');
}
function exportFile(){
  try{
    const blob=new Blob([backupJSON()],{type:'application/json'}); const url=URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download='aufstieg-backup-'+todayKey()+'.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000); toast('Backup erstellt');

}

document.addEventListener('click',e=>{
  if(e.target.closest('[data-stop]')) return;
  const t=e.target.closest('[data-check],[data-nav],[data-open],[data-close],[data-cal],[data-filter],[data-weeks],[data-new],[data-edit],[data-samples],[data-wipe],[data-icon],[data-color],[data-day],[data-quick],[data-save],[data-del],[data-ana],[data-goals],[data-gstep],[data-gall],[data-gsave],[data-move],[data-sgoal],[data-export],[data-import],[data-expfile],[data-expcopy],[data-impfile],[data-impapply]');
  if(!t) return;
  const ds=t.dataset;
  if('check' in ds){ e.stopPropagation(); const h=habitById(ds.check); if(h&&ds.k<=todayKey()) toggle(h,ds.k); return; }
  if('close' in ds){ ds.close==='sheet'?closeSheet():closeDetail(); return; }
  if('nav' in ds){ showScreen(ds.nav); return; }
  if('open' in ds){ openDetail(ds.open); return; }
  if('cal' in ds){ ui.calOffset=ds.cal==='0'?0:ui.calOffset+ +ds.cal; renderCal(); return; }
  if('ana' in ds){ ui.anaOffset=Math.min(1,ui.anaOffset+ +ds.ana); renderAna(); return; }
  if('goals' in ds){ openGoals(); return; }
  if('move' in ds){ moveHabit(ds.move,+ds.dir); return; }
  if('export' in ds){ openBackup('export'); return; }
  if('import' in ds){ openBackup('import'); return; }
  if('expfile' in ds){ exportFile(); return; }
  if('expcopy' in ds){ const ta=$('#bk-text'); ta.focus(); ta.select(); ta.setSelectionRange(0,ta.value.length); const done=()=>toast('Kopiert'); if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(done,()=>{ try{ document.execCommand('copy'); done(); }catch(e){ toast('Bitte manuell kopieren'); } }); } else { try{ document.execCommand('copy'); done(); }catch(e){ toast('Bitte manuell kopieren'); } } return; }
  if('impfile' in ds){ const f=$('#imp-file'); if(f) f.click(); return; }
  if('impapply' in ds){ const ta=$('#bk-text'); if(ta&&ta.value.trim()) applyImport(ta.value); else toast('Nichts eingefügt'); return; }
  if('sgoal' in ds){ S.sleepGoal=Math.max(4,Math.min(12,S.sleepGoal+ +ds.sgoal)); commit(); return; }
  if(ui.gdraft){
    const g=ui.gdraft;
    if('gstep' in ds){ g.vals[ds.gstep]=Math.max(5,Math.min(100,(g.vals[ds.gstep]||100)+ +ds.d)); renderGoals(); return; }
    if('gall' in ds){ for(const id in g.vals) g.vals[id]=+ds.gall; renderGoals(); return; }
    if('gsave' in ds){ saveGoals(); return; }
  }
  if('filter' in ds){ ui.statFilter=ds.filter; renderStats(); return; }
  if('weeks' in ds){ ui.statWeeks=+ds.weeks; renderStats(); return; }
  if('new' in ds){ openEditor(null); return; }
  if('edit' in ds){ openEditor(ds.edit); return; }
  if('samples' in ds){ loadSamples(); return; }
  if('wipe' in ds){ if(ui.armed==='wipe'){ S=normalize(null); ui.armed=null; commit(); toast('Alles gelöscht'); } else { ui.armed='wipe'; renderDetail(); setTimeout(()=>{ if(ui.armed==='wipe'){ ui.armed=null; if(ui.detail==='profile') renderDetail(); } },3000); } return; }
  if(ui.draft){
    const d=ui.draft; const nameEl=$('#ed-name'); if(nameEl) d.name=nameEl.value;
    if('icon' in ds){ d.icon=ds.icon; renderSheet(); return; }
    if('color' in ds){ d.color=+ds.color; renderSheet(); return; }
    if('day' in ds){ const n=+ds.day; d.days=d.days.includes(n)?d.days.filter(x=>x!==n):[...d.days,n]; renderSheet(); return; }
    if('quick' in ds){ d.days=ds.quick==='all'?[1,2,3,4,5,6,7]:ds.quick==='work'?[1,2,3,4,5]:[6,7]; renderSheet(); return; }
    if('save' in ds){ saveDraft(); return; }
    if('del' in ds){ if(ui.armed==='del'){ deleteHabit(ui.sheet); } else { ui.armed='del'; renderSheet(); setTimeout(()=>{ if(ui.armed==='del'){ ui.armed=null; if(ui.sheet) renderSheet(); } },3000); } return; }
  }
});
document.addEventListener('input',e=>{
  if(e.target.matches('[data-sleep]')){ const t=e.target, v=+t.value; t.style.setProperty('--p',(v/SLEEP_MAX*100).toFixed(1)+'%'); const o=t.parentElement.querySelector('[data-out]'); if(o) o.textContent=fmtH(v); return; }
  if(e.target.id==='ed-name'&&ui.draft){ ui.draft.name=e.target.value; const b=$('[data-save]'); if(b) b.disabled=!e.target.value.trim(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='imp-file'){ const f=e.target.files&&e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>applyImport(String(r.result||'')); r.onerror=()=>toast('Datei konnte nicht gelesen werden'); r.readAsText(f); return; }
  if(e.target.matches('[data-sleep]')){ const k=e.target.dataset.sleep, v=+e.target.value; if(v>0) S.sleep[k]=v; else delete S.sleep[k]; commit(); return; }
  if(e.target.id==='p-name'){ S.name=e.target.value.slice(0,24); commit(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(ui.sheet) closeSheet(); else if(ui.detail) closeDetail(); return; }
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][tabindex]')){ e.preventDefault(); e.target.click(); }
  if(e.key==='Enter'&&e.target.id==='ed-name'&&ui.draft&&ui.draft.name.trim()){ saveDraft(); }
});
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) renderAll(); });

renderAll();
initCloud();
</script>
</body>
</html>
